[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true

# VK derivation for `regenerate-canonical`. The xtask used to shell
# out to `bb write_vk` (CLI) to stay light, but bb-CLI VKs were not
# compatible with proofs generated by the noir_rs FFI (the only
# prover path mobile/SRA wallets have). We now route through
# `outbe-zk-circuit-noir::derive_canonical_keccak_vk`, which goes
# through the same FFI as the prover — guaranteeing every wallet
# proof verifies against the canonical VK. Cost: a one-time
# multi-minute C++ build of the barretenberg FFI on first xtask
# compile.
outbe-zk-circuit-noir = { workspace = true }
tiny-keccak  = { version = "2.0", features = ["keccak"] }
base64.workspace = true
serde_json.workspace = true

[workspace.package]
version = "0.20.0"
edition = "2021"
authors    = ["Outbe"]
license    = "MIT"
repository = "https://github.com/outbe/outbe-circuits"

[workspace]
members = [
    "crates/*",
    "examples/*",
    "xtask",
]
resolver = "2"

# Centralized versions for every non-git dependency. Members opt in with
# `{ workspace = true }` and add their own features. The noir git deps
# (acir / acvm / bn254_blackbox_solver) are NOT here — they stay inline in
# `outbe-zk-backend` with their `tag = ...`, by design.
[workspace.dependencies]

# Local crates. `version` next to `path` keeps the publishable crates
# (outbe-zk-canonical) resolvable by cargo-deny / `cargo publish`.
outbe-zk-core = { path = "crates/outbe-zk-core", version = "0.20.0" }
# The L1-to-L2 contract: claim entities, bindings and claim ABIs. Holds no
# verification key, so a consumer that only folds claims takes this alone.
outbe-l2-claims = { path = "crates/outbe-l2-claims", version = "0.20.0" }
# The L2 registry: committed roots, the key table and the key-aware decoders.
# Depends on outbe-l2-claims; deliberately not wired to outbe-zk-canonical in
# either direction.
outbe-l2-zk-canonical = { path = "crates/outbe-l2-zk-canonical", version = "0.20.0" }
# The `#[derive(Entity)]` proc-macro, re-exported by outbe-zk-core so a
# consumer needs one dependency. No cycle: it depends only on syn/quote.
outbe-zk-core-derive = { path = "crates/outbe-zk-core-derive", version = "0.20.0" }

# BN254 Poseidon / Poseidon2 (Barretenberg/noir-compatible). External git
# crate; the `version` next to the git ref satisfies cargo-deny's wildcard
# check for the publishable downstream crates. cargo resolves the tagged rev.
outbe-poseidon = { version = "0.11.0", git = "https://github.com/outbe/outbe-poseidon/", tag = "v0.11.0" }

# arkworks. `curve` is enabled at the workspace level (needed by the zk crates;
# additive with the protocol crate's extra `asm`/`parallel`).
ark-bn254     = { version = "0.6", default-features = false, features = ["curve"] }
ark-grumpkin  = { version = "0.6", default-features = false }
ark-ff        = { version = "0.6", default-features = false }
ark-ec        = { version = "0.6", default-features = false }
ark-std       = { version = "0.6", default-features = false }

# Pure-Rust BLAKE2s for the barretenberg-compatible Grumpkin Schnorr challenge.
blake2        = { version = "0.10", default-features = false }
alloy-primitives = { version = "1", default-features = false }
thiserror     = { version = "2", default-features = false }
# Floor (not exact pin) so the noir acvm toolchain — which pulls
# `der 0.8 -> zeroize ^1.8` — can coexist in one workspace resolution.
zeroize        = { version = "1.7", default-features = false }
# outbe-zk-core-derive proc-macro stack.
syn         = { version = "2", features = ["full"] }
quote       = "1"
proc-macro2 = "1"

# Encoding / hashing for the canonical registry + xtask freeze pipeline.
hex-literal   = "0.4"
base64        = "0.22"
flate2        = "1"
serde_json    = "1"
tiny-keccak   = { version = "2", features = ["keccak"] }
toml          = "0.8"
toml_edit     = "0.22"
sha2          = { version = "0.10", default-features = false }

# barretenberg via FFI; the bb CLI used by `xtask freeze-circuits` must match
# this exact version (see mise `install:bb`).
barretenberg-rs = { version = "=5.0.0-nightly.20260522", default-features = false, features = ["ffi"] }
# SRS download fallback (Aztec CRS) — only pulled by outbe-zk-backend's
# `with-network-srs` feature.
reqwest       = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# Cross-circuit proving/verification benches.
criterion     = { version = "0.5", default-features = false }

# Dev / testing: opt-level 3 keeps Noir proving times sane (debug proving is
# otherwise extremely slow).
[profile.dev]
opt-level = 3
debug = 2
overflow-checks = true
incremental = true

[profile.local]
inherits = "dev"
opt-level = 3
debug = 2
debug-assertions = false
panic = 'unwind'
incremental = true
lto = "thin"
codegen-units = 16

[profile.release]
opt-level = 3
overflow-checks = false
debug = false

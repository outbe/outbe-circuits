# cargo-deny configuration.
#
# Runs in CI on every PR + nightly at 04:00 UTC.
#
# outbe-circuits consumes Noir's Rust FFI surface (acir / acvm /
# bn254_blackbox_solver, pulled directly from the noir-lang upstream as
# git deps pinned to v1.0.0-beta.22 in `outbe-zk-backend`) on top of a
# heavy transitive tree. The only git sources are `noir-lang/noir` and the
# in-house `outbe/outbe-poseidon`. That tree forces (a) two extra licenses,
# (b) a sizeable [bans.skip] list, and (c) the workspace-path wildcard
# carve-out. None of these are individually fixable in this repo; each one
# is annotated with the upstream chain that drives it.
#
# When a violation surfaces, prefer the upstream fix:
#   - multiple-versions  -> bump the dep pulling in the older
#                           one, or add a [patch.crates-io] until
#                           upstream catches up; only [bans.skip]
#                           with a rationale if upstream-blocked.
#   - advisory           -> upgrade the affected crate; only add
#                           to [advisories.ignore] with the
#                           RUSTSEC id and a written-out reason.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste 1.0.x is unmaintained but still depended on by ark-ff's
    # proc-macro layer, which the noir → acir_field chain pulls in.
    # No safe upgrade exists in the 0.6.x ark-* line; ark-* has
    # not cut a release that drops paste. Mirrors the same ignore
    # in outbe-poseidon and outbe-protocol.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # `Unicode-3.0` is the current license of `unicode-ident` (pulled
    # in transitively via every proc-macro crate).
    "Unicode-3.0",
    "Zlib",
    # Public-domain dedications driven by the dependency tree.
    #   - CC0-1.0  : `tiny-keccak` (used directly by xtask for the
    #                canonical VK derivation key + transitively by
    #                cryptographic deps)
    #   - CDLA-Permissive-2.0 : `webpki-roots` (TLS cert bundle via
    #                           reqwest in outbe-zk-backend)
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The in-workspace path deps (e.g. outbe-zk-backend's dev-dep on
# outbe-zk-canonical) are version-less path requirements, which
# cargo-deny interprets as wildcards. This carve-out only exempts
# path-based workspace deps; external wildcard requirements still fail.
allow-wildcard-paths = true
deny = []
# Every entry below is a duplicate-version forced by an upstream
# transitive dep tree we don't own. The shared rationale: noir-lang
# pins different versions than the k256 0.14-rc line and the older
# ark-* lines, and there's no single bump on our side that
# consolidates them. Each entry will become removable once the
# corresponding upstream catches up; revisit on every noir / k256 /
# ark-* version bump.
skip = [
    # rand_core split: 0.6 (ark-* / older crypto) vs 0.9-pre (k256 0.14-rc).
    { crate = "rand_core" },
    # OS RNG split: 0.2 (older tree) vs 0.3 (newer rand 0.9+ tree).
    { crate = "getrandom" },
    # k256 0.14-rc adopted the 0.11-pre line of the RustCrypto stack;
    # older crates remain on 0.10.
    { crate = "sha2" },
    { crate = "digest" },
    { crate = "crypto-common" },
    { crate = "block-buffer" },
    { crate = "cpufeatures" },
    # blake2 0.10 (outbe-protocol) vs 0.11-rc (noir beta.22 bn254_blackbox_solver);
    # generic-array 0.14 (digest 0.10 stack) vs 1.x (outbe-protocol codec).
    { crate = "blake2" },
    { crate = "generic-array" },
    # thiserror 1.x (noir, some older deps) vs 2.x (rest of the tree).
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    # toml / winnow ecosystem: cargo-metadata and noirc_* pulled
    # different generations.
    { crate = "toml_edit" },
    { crate = "toml_datetime" },
    { crate = "winnow" },
    # UEFI guard pulled in by getrandom 0.3 alongside the older copy.
    { crate = "r-efi" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # noir-lang upstream — acir / acvm / bn254_blackbox_solver (and
    # their noirc_* transitive deps) are consumed via this single git
    # origin, pinned per-rev in Cargo.lock to the v1.0.0-beta.22 tag
    # referenced inline in `outbe-zk-backend`.
    "https://github.com/noir-lang/noir",
    # outbe-poseidon is consumed as a git dep (tagged release) while
    # the crate stabilises; flips to a crates.io version once
    # outbe-poseidon is published.
    "https://github.com/outbe/outbe-poseidon",
]

# Circuit registry — append-only.
#
# Each [[circuit]] is a frozen, released circuit version; its artifacts live at
# `resources/circuits/<module>/<version>/{bytecode.b64, circuit.vk, abi.json}`
# and are immutable once committed. `build.rs` reads this file and emits the
# in-code registry (`CIRCUIT_REGISTRY`) plus the per-circuit types for the latest
# active version of each module. Mint new versions with
# `cargo xtask freeze-circuits` (the only step that runs nargo/bb); status
# transitions (active → deprecated → revoked) are edits here, reviewed in a PR.

# Logical proof system these VKs verify under (the bb pin). A bb bump that
# changes the wire format gets a new proof_system + re-frozen circuits.
proof_system = "bb-keccak-v1"


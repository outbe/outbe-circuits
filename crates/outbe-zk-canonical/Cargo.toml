[package]
name = "outbe-zk-canonical"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Concrete canonical circuit/witness types for the Outbe protocol (ownership + flat aggregation), built on the generic outbe-protocol traits."
readme = "README.md"

[build-dependencies]
serde_json = { workspace = true }
tiny-keccak = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }

[dependencies]
outbe-protocol = { workspace = true }
ark-ff = { workspace = true }
ark-std = { workspace = true }
ark-bn254 = { workspace = true }
# Compile-time `hex!("..")` -> `[u8; N]` for the generated circuit/vk hashes.
hex-literal = { workspace = true }

# `hex-literal` is consumed only by `build.rs`-generated code (emitted into
# OUT_DIR as `::hex_literal::hex!(..)`), which source-scanning tools can't see —
# tell cargo-machete it's intentional, not dead.
[package.metadata.cargo-machete]
ignored = ["hex-literal"]

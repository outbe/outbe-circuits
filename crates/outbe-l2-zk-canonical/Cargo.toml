[package]
name = "outbe-l2-zk-canonical"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
description = "The L2 registry of the Outbe zk gate: the committed L2 circuit roots, their verification keys and the key-aware public-input decoders."
keywords    = ["outbe", "zero-knowledge", "bn254", "layer2", "consensus"]
categories  = ["cryptography"]
readme      = "README.md"

# Deliberately NOT a dependency of (or on) `outbe-zk-canonical` or
# `outbe-zk-backend`: an L2 registration must never be able to touch an L1
# circuit. `outbe-l2-claims` is a dependency one way only — this crate holds
# the keys, that one holds the contract, and a claim-only consumer takes that
# one instead of this one. Keep this dependency list to the core.
[dependencies]
# The claim contract: entities, bindings, ABIs and the generated
# `PublicInputs`. Re-exported as `claims::<name>`, where the generated
# key-aware decoder joins it.
outbe-l2-claims = { workspace = true }
outbe-zk-core = { workspace = true, features = ["alloy"] }
ark-bn254     = { workspace = true }
# Compile-time `hex!("..")` -> `[u8; 32]` for the generated `vk_hash` literals.
hex-literal = { workspace = true }

# The claim entities carry `B256` members, but this crate only passes them
# through: only the tests spell `alloy_primitives` out.
[dev-dependencies]
alloy-primitives = { workspace = true }

# Read-only codegen over committed files: `l2/manifest.toml` and each root's
# `abi.json` / `circuit.vk`. It never runs `nargo` or `bb`, so `cargo build`
# needs no Noir toolchain.
#
# `outbe-l2-claims` is here as well as in `[dependencies]` because a build
# script cannot read another package's files by path: it takes the crate that
# owns the contract and reads `CLAIM_ABIS` — each claim's `abi.json`,
# `include_str!`d — to gate every committed root's public ABI against it.
[build-dependencies]
outbe-l2-claims = { workspace = true }
serde_json  = { workspace = true }
tiny-keccak = { workspace = true }
toml        = { workspace = true }

# `hex-literal` is reachable only from `build.rs`-generated code (emitted into
# OUT_DIR as `::hex_literal::hex!(..)` for the `vk_hash` literals), which
# source-scanning tools can't see — tell cargo-machete it's intentional.
[package.metadata.cargo-machete]
ignored = ["hex-literal"]

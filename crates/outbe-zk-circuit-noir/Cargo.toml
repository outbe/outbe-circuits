[package]
name = "outbe-zk-circuit-noir"
version.workspace = true
edition = "2021"
description = "Noir circuit implementation for ZK proofs - ownership and Merkle inclusion"
license = "Apache-2.0"
repository = "https://github.com/outbe/outbe-circuits"

# Mobile-loadable library shapes for the CI build-ios / build-android
# jobs. `staticlib` produces the `.a` consumed by the iOS xcframework;
# `cdylib` produces the `.so` consumed by Android's NDK loader. `rlib`
# keeps the crate usable as a normal cargo workspace dep for all the
# rust callers (xtask, outbe-zk-canonical tests, the desktop prover
# integration tests).
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Witness types, hash formulas, and consensus-binding primitives.
outbe-crypto-common = { workspace = true }

# Noir proving glue. The thin set of noir_rs entry points we use
# (~821 LOC across 13 files) is vendored under
# `src/vendor/noir_rs/` (Apache-2.0; see `NOTICE.md` and
# `vendor/noir_rs/LICENSE`). The four noir-lang/noir crates plus
# `barretenberg-rs` below are the direct deps the vendored code
# consumes; they were previously transitive via noir_rs and remain
# pinned to the same `v1.0.0-beta.21` git rev so the resulting dep
# graph (and therefore proof output) is identical to pre-vendoring.
acvm                  = { workspace = true }
acvm_blackbox_solver  = { workspace = true }
bn254_blackbox_solver = { workspace = true }
nargo                 = { workspace = true }
barretenberg-rs       = { workspace = true }

# Direct deps required by the vendored noir_rs proving glue. Same
# versions upstream noir_rs declared.
base64  = { workspace = true }
flate2  = { workspace = true }
bincode = { workspace = true }
reqwest = { workspace = true }
serde   = { workspace = true }

anyhow.workspace = true
# Hex encoding for bytecode
bs58.workspace = true

serde_json.workspace = true

# Used by the `testing` module (Grumpkin keypair generation, witness
# builders). It's a pub mod, not feature-gated, because integration
# tests and benches in this crate use it and Cargo doesn't offer a
# clean way to expose a `cfg(test)` module to `tests/*.rs`. Runtime
# cost is negligible next to barretenberg-rs.
ark-ff     = { workspace = true }
ark-bn254  = { workspace = true }
rand       = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Used by `examples/measure_pk.rs` to read peak macOS RSS.
libc = "0.2"
# Canonical descriptors (circuit_hash + canonical VK bytes). Used by
# the aggregation integration tests so they verify against the same
# VK that the on-chain `zk_verify` precompile consumes.
outbe-zk-canonical.workspace = true

[[bench]]
name = "proof_perf"
harness = false

[features]
# Enable round-trip tests for tier sizes N >= 4. Default off because
# each tier prove+verify takes tens of seconds (N=64 several minutes)
# under barretenberg, which would balloon a normal `cargo test` run.
aggregation-full-tiers = []

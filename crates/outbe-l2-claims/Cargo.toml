[package]
name = "outbe-l2-claims"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
description = "The Outbe L1-to-L2 claim contract: the claim entities and their bindings, the claim public-input ABIs, and the generated public-input types."
keywords    = ["outbe", "zero-knowledge", "bn254", "layer2", "consensus"]
categories  = ["cryptography"]
readme      = "README.md"

# This crate holds no verification key, no committed root and no registry —
# those are `outbe-l2-zk-canonical`, which depends on this one. The direction
# is the guarantee: a consumer that only hashes claims (a prover, a TEE image)
# takes this crate and no key can reach its binary, under any cargo invocation.
# Keep this dependency list to the core.
[dependencies]
outbe-zk-core = { workspace = true, features = ["alloy"] }
ark-bn254     = { workspace = true }
# Every claim entity carries `B256` members, so the `alloy` codec impls are
# load-bearing rather than a convenience feature.
alloy-primitives = { workspace = true }

# Read-only codegen over the committed `claims/<name>/abi.json`. It never runs
# `nargo` or `bb`, so `cargo build` needs no Noir toolchain.
[build-dependencies]
serde_json = { workspace = true }

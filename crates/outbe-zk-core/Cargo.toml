[package]
name        = "outbe-zk-core"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
description = "Concrete BN254/Grumpkin/Poseidon2 primitives for the Outbe zk circuits: codec, hashes, keys, entity model, circuit seams and verifier-wire decoders."
readme      = "README.md"
keywords    = ["outbe", "poseidon", "bn254", "zero-knowledge", "consensus"]
categories  = ["cryptography"]

[features]
# Field-encoding impls for alloy ABI scalar types (address / uint256 /
# bytes32), so consumers can use bare alloy types in entity structs. The
# impls must live here, next to the trait (orphan rule).
alloy = ["dep:alloy-primitives"]

[dependencies]
ark-bn254     = { workspace = true, features = ["curve", "asm"] }
ark-grumpkin  = { workspace = true, features = ["asm"] }
ark-ff        = { workspace = true, features = ["asm", "parallel"] }
ark-ec        = { workspace = true, features = ["parallel"] }
ark-std       = { workspace = true, features = ["parallel"] }
outbe-poseidon  = { workspace = true }
blake2        = { workspace = true }
alloy-primitives = { workspace = true, optional = true }
thiserror     = { workspace = true }
zeroize        = { workspace = true }
# Re-exported as `outbe_zk_core::Entity` so a consumer needs one dependency.
outbe-zk-core-derive = { workspace = true }


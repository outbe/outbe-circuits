name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep push-to-main verification runs running to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # dorny/paths-filter resolves the pull request's base through the API.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # --------------------------------------------------------------
  # Runs cargo-deny on the host (not the EmbarkStudios container
  # action) so cargo-metadata can use the host's git config. The
  # remaining git dependency (noir-lang/noir) is public — no PAT or credential helper needed.
  # --------------------------------------------------------------
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: cargo

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check all
        run: cargo deny check all

  # --------------------------------------------------------------
  # Which key-reproduction jobs have to run. A job skipped by a
  # job-level `if:` still reports as skipped, which branch
  # protection counts as satisfied — unlike a workflow-level
  # `paths:` filter, which would also gate cargo-deny and check.
  # --------------------------------------------------------------
  changes:
    name: path filter
    runs-on: ubuntu-latest
    outputs:
      l1: ${{ steps.filter.outputs.l1 }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            l1:
              - 'crates/outbe-zk-canonical/noir/**'
              - 'crates/outbe-zk-canonical/resources/circuits/**'
              - 'crates/outbe-zk-canonical/circuits/manifest.toml'
              - 'mise.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'xtask/**'
              - '.github/workflows/ci.yml'

  # --------------------------------------------------------------
  # Format + clippy + cargo test on stable & beta. Runs on PR +
  # push:main. `[skip ci]` anywhere in the head commit message opts out —
  # `github.event.head_commit` is populated only on `push`, so the opt-out
  # does nothing on a pull request or a `workflow_dispatch`.
  # --------------------------------------------------------------
  check:
    name: cargo fmt + clippy + test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      # barretenberg-rs links a C++ static lib whose build.rs invokes
      # cmake + clang against libstdc++/libc++. Without these the
      # first `cargo` invocation that touches outbe-zk-backend
      # fails in build.rs, not in rustc.
      - name: Install C++ toolchain (barretenberg-rs build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang \
            libstdc++-12-dev \
            libc++-dev libc++abi-dev \
            pkg-config libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache slot per toolchain so stable + beta don't
          # clobber each other.
          key: ${{ matrix.rust }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::dbg_macro \
            -D clippy::print_stdout \
            -D clippy::print_stderr \
            -D clippy::todo \
            -D clippy::unimplemented \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc

      - name: cargo test --workspace
        run: cargo test --workspace

      # `outbe-zk-canonical/tests/alloy_inputs.rs` is a whole-file
      # `#![cfg(feature = "alloy")]`, and `alloy` is optional. The run above
      # only reaches it because `outbe-zk-backend`'s dev-dependency happens to
      # unify the feature in, so ask for it here explicitly. Enabling it in the
      # crate's own manifest instead would turn it on for every build and leave
      # the feature-off path untestable.
      - name: cargo test -p outbe-zk-canonical --features alloy
        run: cargo test -p outbe-zk-canonical --features alloy

      # The nargo pin lives only in mise.toml — no hand-copied version
      # string. `install_args` is load-bearing: mise.toml also declares
      # `rust = "latest"`, and a bare `mise install` would put a rust
      # shim on PATH ahead of the stable/beta toolchain installed
      # above, silently collapsing the matrix to one row.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
          install_args: nargo

      - name: cargo xtask test-circuits
        run: cargo xtask test-circuits

  # Recompile active circuits and reject ACIR/ABI drift on a clean checkout.
  l1-freeze-check:
    name: l1 freeze check
    needs: changes
    if: ${{ needs.changes.outputs.l1 == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
          install_args: nargo bb

      - uses: Swatinem/rust-cache@v2
        with:
          key: l1-freeze-check

      - name: Cache the bb CRS
        uses: actions/cache@v4
        with:
          path: ~/.bb-crs
          key: bb-crs-${{ hashFiles('mise.toml') }}

      - name: Regenerate frozen circuits and check for drift
        run: |
          cargo xtask freeze-circuits
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  # --------------------------------------------------------------
  # Versioning (cocogitto). See cog.toml.
  #
  # Pull requests only: report the version a merge would cut, tagging nothing.
  # The history predates Conventional Commits, so the check covers the range
  # the pull request introduces rather than the whole log.
  # --------------------------------------------------------------
  preview-version:
    name: preview next version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cog reads the full history + tags
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
          install_args: cocogitto

      - name: Validate the commits this pull request adds
        run: >-
          mise exec -- cog check --ignore-merge-commits
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Preview the bump
        shell: bash
        run: |
          set -euo pipefail
          # Neutralise cog.toml's branch_whitelist for this read-only preview so
          # it runs from a pull-request ref. Nothing is committed or tagged.
          cfg="$(mktemp -d)/cog.toml"
          sed 's/^branch_whitelist.*/branch_whitelist = []/' cog.toml > "$cfg"
          if out="$(mise exec -- cog --config "$cfg" bump --auto --dry-run --skip-untracked 2>/dev/null)"; then
            tag="$(printf '%s\n' "$out" | grep -Eo 'v?[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*' | tail -n1 || true)"
            echo "::notice::next release would be: ${tag:-<no bump warranted>}"
          else
            echo "::notice::no bump warranted"
          fi

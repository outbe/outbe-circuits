name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a push-to-main run: that is the one that re-derives every
  # committed key with `--all`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # dorny/paths-filter resolves the pull request's base through the API.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # --------------------------------------------------------------
  # Runs cargo-deny on the host (not the EmbarkStudios container
  # action) so cargo-metadata can use the host's git config. Both
  # remaining git deps (noir-lang/noir, outbe/outbe-poseidon) are
  # public — no PAT or credential helper needed.
  # --------------------------------------------------------------
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: cargo

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check all
        run: cargo deny check all

  # --------------------------------------------------------------
  # Which key-reproduction jobs have to run. A job skipped by a
  # job-level `if:` still reports as skipped, which branch
  # protection counts as satisfied — unlike a workflow-level
  # `paths:` filter, which would also gate cargo-deny and check.
  # --------------------------------------------------------------
  changes:
    name: path filter
    runs-on: ubuntu-latest
    outputs:
      l1: ${{ steps.filter.outputs.l1 }}
      l2: ${{ steps.filter.outputs.l2 }}
      toolchain: ${{ steps.filter.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A toolchain move is the only way an untouched committed key
          # stops reproducing: the nargo/bb pins (mise.toml), the
          # barretenberg-rs pin (the workspace Cargo.toml) and
          # proof_system (the L1 manifest, which `l2 verify` compares
          # the L2 manifest against).
          filters: |
            toolchain:
              - 'mise.toml'
              - 'Cargo.toml'
              - 'crates/outbe-zk-canonical/circuits/manifest.toml'
            l2:
              - 'crates/outbe-l2-zk-canonical/l2/**'
              - 'crates/outbe-l2-claims/claims/**'
              - 'mise.toml'
              - 'Cargo.toml'
              - 'crates/outbe-zk-canonical/circuits/manifest.toml'
            l1:
              - 'crates/outbe-zk-canonical/noir/**'
              - 'crates/outbe-zk-canonical/resources/circuits/**'
              - 'crates/outbe-zk-canonical/circuits/manifest.toml'
              - 'mise.toml'

  # --------------------------------------------------------------
  # Format + clippy + cargo test on stable & beta. Runs on PR +
  # push:main. `[skip ci]` anywhere in the head commit message opts out —
  # `github.event.head_commit` is populated only on `push`, so the opt-out
  # does nothing on a pull request or a `workflow_dispatch`.
  # --------------------------------------------------------------
  check:
    name: cargo fmt + clippy + test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      # barretenberg-rs links a C++ static lib whose build.rs invokes
      # cmake + clang against libstdc++/libc++. Without these the
      # first `cargo` invocation that touches outbe-zk-backend
      # fails in build.rs, not in rustc.
      - name: Install C++ toolchain (barretenberg-rs build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang \
            libstdc++-12-dev \
            libc++-dev libc++abi-dev \
            pkg-config libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache slot per toolchain so stable + beta don't
          # clobber each other.
          key: ${{ matrix.rust }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::dbg_macro \
            -D clippy::print_stdout \
            -D clippy::print_stderr \
            -D clippy::todo \
            -D clippy::unimplemented \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc

      - name: cargo test --workspace
        run: cargo test --workspace

      # `outbe-zk-canonical/tests/alloy_inputs.rs` is a whole-file
      # `#![cfg(feature = "alloy")]`, and `alloy` is optional. The run above
      # only reaches it because `outbe-zk-backend`'s dev-dependency happens to
      # unify the feature in, so ask for it here explicitly. Enabling it in the
      # crate's own manifest instead would turn it on for every build and leave
      # the feature-off path untestable.
      - name: cargo test -p outbe-zk-canonical --features alloy
        run: cargo test -p outbe-zk-canonical --features alloy

      # The nargo pin lives only in mise.toml — no hand-copied version
      # string. `install_args` is load-bearing: mise.toml also declares
      # `rust = "latest"`, and a bare `mise install` would put a rust
      # shim on PATH ahead of the stable/beta toolchain installed
      # above, silently collapsing the matrix to one row.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
          install_args: nargo

      - name: cargo xtask test-circuits
        run: cargo xtask test-circuits

  # --------------------------------------------------------------
  # Reproduces every touched L2 verification key from its committed
  # Noir root. This is the admission gate for an L2 registration.
  # `cargo xtask` pulls in only serde_json/base64/tiny-keccak/toml_edit,
  # never barretenberg-rs, so no C++ toolchain step is needed: the
  # prebuilt `bb` links the libstdc++6 runtime ubuntu-latest ships.
  # --------------------------------------------------------------
  l2-verify:
    name: l2 verify
    needs: changes
    if: ${{ needs.changes.outputs.l2 == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `l2 verify --changed` runs `git merge-base origin/$GITHUB_BASE_REF
          # HEAD`. The default depth-1 checkout has no origin/<base> ref and
          # the merge-base fails.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
          install_args: nargo bb

      - uses: Swatinem/rust-cache@v2
        with:
          key: l2-verify

      # `bb write_vk` needs the Aztec SRS: ~64MB bn254_g1.dat plus
      # ~2MB grumpkin_g1.flat.dat, downloaded on first use. Keyed on
      # the bb pin, which lives in mise.toml.
      - name: Cache the bb CRS
        uses: actions/cache@v4
        with:
          path: ~/.bb-crs
          key: bb-crs-${{ hashFiles('mise.toml') }}

      - name: cargo xtask l2 verify
        run: |
          # A toolchain move can break any committed key, not only a
          # touched one. A push to main has no PR base, so --changed
          # would select nothing — merges always re-derive everything.
          if [ "${{ needs.changes.outputs.toolchain }}" = 'true' ] \
            || [ "${{ github.event_name }}" = 'push' ]; then
            cargo xtask l2 verify --all
          else
            cargo xtask l2 verify --changed
          fi

  # --------------------------------------------------------------
  # Dry run of the L1 freeze: recompiles every active L1 circuit and
  # asserts its committed ACIR, ABI and VK reproduce. Writes nothing
  # under resources/circuits/ or circuits/manifest.toml.
  # --------------------------------------------------------------
  l1-freeze-check:
    name: l1 freeze check
    needs: changes
    if: ${{ needs.changes.outputs.l1 == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
          install_args: nargo bb

      - uses: Swatinem/rust-cache@v2
        with:
          key: l1-freeze-check

      - name: Cache the bb CRS
        uses: actions/cache@v4
        with:
          path: ~/.bb-crs
          key: bb-crs-${{ hashFiles('mise.toml') }}

      # No --all/--changed split: it always checks every `active` entry.
      - name: cargo xtask freeze-circuits --check
        run: cargo xtask freeze-circuits --check

      # The dry run compiles a scratch copy under target/. The two
      # tracked noir/<pkg>/target/<module>.json files (emit_mint.json,
      # paynote.json), and everything under resources/circuits/, must
      # come out byte-identical.
      - name: the dry run wrote nothing
        run: git diff --exit-code

# Install mise once (https://mise.jdx.dev),
# then `mise tasks ls` to list or `mise run <task>` to invoke. Every task
# documents the equivalent raw command so non-mise users can copy-paste.
#
# Circuit tests need `nargo`; freezing additionally needs `bb`. Plain
# `cargo build`/`test` need neither because `outbe-zk-canonical` builds from
# committed frozen artifacts.
[tools]
rust = "latest"

[tools.nargo]
version = "1.0.0-beta.22"
matching_regex = "^nargo-"
rename_exe = "nargo"

[tools.bb]
version = "5.0.0-nightly.20260522"
matching_regex = "^barretenberg-(amd64|arm64)-(darwin|linux)\\.tar\\.gz$"
rename_exe = "bb"

[tool_alias]
nargo = "github:noir-lang/noir"
bb = "github:AztecProtocol/barretenberg"

# ---------------------------------------------------------------
# Noir circuit tests.
# ---------------------------------------------------------------
[tasks."test-circuits"]
description = "Run nargo test in every vendored Noir package"
run = "cargo xtask test-circuits"

# ---------------------------------------------------------------
# Canonical circuit management. `freeze-circuits` recompiles the Noir circuits,
# refreshes the committed bytecode/VKs, and updates the manifest. Needs nargo +
# bb on PATH / ~/.nargo / ~/.bb; xtask also honours $NARGO / $BB overrides.
# ---------------------------------------------------------------
[tasks."freeze-circuits"]
description = "Recompile circuits + refresh frozen artifacts: cargo run -p xtask -- freeze-circuits"
run = "cargo run -p xtask -- freeze-circuits"

[tasks."freeze-circuits:abi-change"]
description = "freeze-circuits minting a new circuit version on an ABI change (--abi-change)"
run = "cargo run -p xtask -- freeze-circuits --abi-change"

# ---------------------------------------------------------------
# Convenience: the CI gate locally.
# ---------------------------------------------------------------
[tasks.check]
description = "fmt + clippy + test across the workspace (mirrors CI)"
run = '''
set -euo pipefail
cargo fmt --all -- --check
cargo clippy --workspace --all-targets --all-features -- -D warnings
cargo test --workspace
cargo xtask test-circuits
'''

[tasks.fmt]
description = "format code"
run = "cargo fmt --all"

[tasks.build]
description = "format code"
run = "cargo build --workspace"

# Install mise once (https://mise.jdx.dev),
# then `mise tasks ls` to list or `mise run <task>` to invoke. Each task's
# `run =` line below is the raw command it shells out to, for copy-pasting
# without mise; the `description` is a label, not always the command.
#
# Circuit tests need `nargo`; freezing additionally needs `bb`.
# Plain `cargo build`/`test` use committed frozen artifacts.
[tools]
rust = "latest"
# Conventional-commit check + auto-versioning; see cog.toml. CI installs just
# this one tool rather than the whole set, so keep the pin here.
cocogitto = "7"

[tools.nargo]
version = "1.0.0-beta.22"
matching_regex = "^nargo-"
rename_exe = "nargo"

[tools.bb]
version = "5.0.0-nightly.20260522"
matching_regex = "^barretenberg-(amd64|arm64)-(darwin|linux)\\.tar\\.gz$"
rename_exe = "bb"

[tool_alias]
nargo = "github:noir-lang/noir"
bb = "github:AztecProtocol/barretenberg"

# ---------------------------------------------------------------
# Noir circuit tests.
# ---------------------------------------------------------------
[tasks."test-circuits"]
description = "Run nargo test in every vendored Noir package"
run = "cargo xtask test-circuits"

# ---------------------------------------------------------------
# Canonical circuit management. `freeze-circuits` recompiles the Noir circuits,
# refreshes the committed bytecode/VKs, and updates the manifest. Needs nargo +
# bb on PATH / ~/.nargo / ~/.bb; xtask also honours $NARGO / $BB overrides.
# ---------------------------------------------------------------
[tasks."freeze-circuits"]
description = "Recompile circuits + refresh frozen artifacts: cargo run -p xtask -- freeze-circuits"
run = "cargo run -p xtask -- freeze-circuits"

[tasks."freeze-circuits:abi-change"]
description = "freeze-circuits minting a new circuit version on an ABI change (--abi-change)"
run = "cargo run -p xtask -- freeze-circuits --abi-change"

# Convenience: Rust checks and Noir tests.
[tasks.check]
description = "fmt + clippy + test across the workspace, then the circuit tests (part of the CI `check` job: not its stable+beta matrix, not its explicit alloy test run; the last line needs nargo)"
run = '''
set -euo pipefail
cargo fmt --all -- --check
cargo clippy --all-targets --all-features -- \
  -D warnings \
  -D clippy::dbg_macro \
  -D clippy::print_stdout \
  -D clippy::print_stderr \
  -D clippy::todo \
  -D clippy::unimplemented \
  -A clippy::module_name_repetitions \
  -A clippy::must_use_candidate \
  -A clippy::missing_errors_doc \
  -A clippy::missing_panics_doc
cargo test --workspace
cargo xtask test-circuits
'''

[tasks.fmt]
description = "format code"
run = "cargo fmt --all"

[tasks.build]
description = "build the workspace"
run = "cargo build --workspace"
